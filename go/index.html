<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Redirecting… | Lang Nuong</title>
  <link rel="stylesheet" href="../style.css">
  <style>
    body { min-height: 100vh; display: grid; place-items: center; background: #faf6ef; margin: 0; font-family: system-ui, -apple-system, sans-serif; }
    .go-card { background: #fff; border: 1px solid #e5e0d8; border-radius: 12px; padding: 28px 30px; max-width: 520px; width: calc(100% - 32px); text-align: center; }
    .go-card h1 { font-size: 1.25rem; margin: 0 0 8px; color: #492200; }
    .go-card p { margin: 0; color: #555; }
    .go-card a { color: #492200; }
  </style>
</head>
<body>
  <main class="go-card" aria-live="polite">
    <h1 id="goTitle">Redirecting…</h1>
    <p id="goMessage">Taking you to your destination.</p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1"></script>
  <script>
    (function () {
      var SUPABASE_URL = 'https://egggnxmzxbqdsqqlnvig.supabase.co';
      var SUPABASE_KEY = 'sb_publishable_jostM0x7NIGiLikFjVHLwA_I_x0IpS8';

      var params = new URLSearchParams(window.location.search);
      var slug = (params.get('c') || params.get('s') || '').trim();

      var title = document.getElementById('goTitle');
      var message = document.getElementById('goMessage');

      function fail(text) {
        title.textContent = 'Link not found';
        message.textContent = text || 'This short link is missing or no longer available.';
      }

      function isSafeUrl(url) {
        try {
          var parsed = new URL(url);
          return parsed.protocol === 'http:' || parsed.protocol === 'https:';
        } catch (error) {
          return false;
        }
      }

      if (!slug) {
        fail('No short link code was provided.');
        return;
      }

      if (!window.supabase || !window.supabase.createClient) {
        fail('We could not load the redirect service. Please try again.');
        return;
      }

      var client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      client.rpc('shortlink_resolve', { p_slug: slug }).then(function (result) {
        if (result.error) {
          var errText = result.error && result.error.message ? ' (' + result.error.message + ')' : '';
          fail('Short links are not available right now.' + errText);
          return;
        }
        var dest = typeof result.data === 'string' ? result.data : '';
        if (!dest) {
          fail('No short link was found for "' + slug + '".');
          return;
        }
        if (!isSafeUrl(dest)) {
          fail('This short link points to an invalid destination.');
          return;
        }
        message.textContent = 'Taking you to ' + dest;
        window.location.replace(dest);
      }).catch(function () {
        fail('Short links are not available right now. Please try again later.');
      });
    })();
  </script>
  <script src="../status.js" defer></script>
  <script src="../analytics.js" defer></script>
</body>
</html>
