<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600">
  <defs>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A4A2E" />
      <stop offset="50%" stop-color="#143A22" />
      <stop offset="100%" stop-color="#0E2A18" />
    </linearGradient>
    <linearGradient id="leafGrad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E5631" />
      <stop offset="50%" stop-color="#14402A" />
      <stop offset="100%" stop-color="#0A2514" />
    </linearGradient>
    <filter id="blur1">
      <feGaussianBlur stdDeviation="2" />
    </filter>
    <filter id="blur2">
      <feGaussianBlur stdDeviation="6" />
    </filter>
    <pattern id="leaves" x="0" y="0" width="400" height="400" patternUnits="userSpaceOnUse">
      <rect width="400" height="400" fill="url(#leafGrad)" opacity="0.3" />
      <!-- Leaf cluster 1 -->
      <g transform="translate(80, 100)" opacity="0.35" filter="url(#blur1)">
        <ellipse cx="0" cy="0" rx="40" ry="25" fill="#1A5A32" />
        <ellipse cx="-20" cy="-8" rx="35" ry="22" fill="#164A28" />
        <ellipse cx="25" cy="-10" rx="30" ry="20" fill="#1C5E36" />
        <ellipse cx="10" cy="18" rx="28" ry="18" fill="#123C22" />
        <ellipse cx="-30" cy="12" rx="25" ry="16" fill="#1A5A32" />
      </g>
      <!-- Leaf cluster 2 -->
      <g transform="translate(300, 350)" opacity="0.3" filter="url(#blur2)">
        <ellipse cx="0" cy="0" rx="50" ry="30" fill="#1E5631" />
        <ellipse cx="-25" cy="-12" rx="45" ry="28" fill="#164A28" />
        <ellipse cx="20" cy="-8" rx="40" ry="25" fill="#1A5A32" />
        <ellipse cx="15" cy="15" rx="38" ry="24" fill="#123C22" />
        <ellipse cx="-35" cy="10" rx="35" ry="22" fill="#1C5E36" />
        <ellipse cx="30" cy="12" rx="30" ry="18" fill="#226238" />
        <ellipse cx="-15" cy="-20" rx="28" ry="18" fill="#1A5A32" />
      </g>
      <!-- Leaf cluster 3 -->
      <g transform="translate(600, 150)" opacity="0.35" filter="url(#blur2)">
        <ellipse cx="0" cy="0" rx="45" ry="28" fill="#1A5A32" />
        <ellipse cx="-22" cy="-10" rx="40" ry="25" fill="#164A28" />
        <ellipse cx="22" cy="-10" rx="38" ry="24" fill="#1C5E36" />
        <ellipse cx="0" cy="15" rx="35" ry="22" fill="#123C22" />
        <ellipse cx="-28" cy="8" rx="32" ry="20" fill="#1A5A32" />
        <ellipse cx="28" cy="10" rx="30" ry="18" fill="#226238" />
      </g>
      <!-- Leaf cluster 4 -->
      <g transform="translate(900, 400)" opacity="0.3" filter="url(#blur1)">
        <ellipse cx="0" cy="0" rx="40" ry="25" fill="#1A5A32" />
        <ellipse cx="-20" cy="-10" rx="35" ry="22" fill="#164A28" />
        <ellipse cx="20" cy="-5" rx="30" ry="20" fill="#1C5E36" />
        <ellipse cx="5" cy="18" rx="28" ry="18" fill="#123C22" />
        <ellipse cx="-25" cy="12" rx="25" ry="16" fill="#1A5A32" />
      </g>
      <!-- Leaf cluster 5 -->
      <g transform="translate(150, 500)" opacity="0.3" filter="url(#blur1)">
        <ellipse cx="0" cy="0" rx="35" ry="22" fill="#1A5A32" />
        <ellipse cx="-18" cy="-8" rx="30" ry="20" fill="#164A28" />
        <ellipse cx="15" cy="-5" rx="28" ry="18" fill="#1C5E36" />
        <ellipse cx="0" cy="15" rx="25" ry="16" fill="#123C22" />
      </g>
      <!-- Leaf cluster 6 -->
      <g transform="translate(750, 250)" opacity="0.3" filter="url(#blur2)">
        <ellipse cx="0" cy="0" rx="50" ry="30" fill="#1E5631" />
        <ellipse cx="-25" cy="-12" rx="45" ry="28" fill="#164A28" />
        <ellipse cx="20" cy="-8" rx="40" ry="25" fill="#1A5A32" />
        <ellipse cx="15" cy="15" rx="38" ry="24" fill="#123C22" />
        <ellipse cx="-35" cy="10" rx="35" ry="22" fill="#1C5E36" />
        <ellipse cx="30" cy="12" rx="30" ry="18" fill="#226238" />
        <ellipse cx="-15" cy="-20" rx="28" ry="18" fill="#1A5A32" />
      </g>
      <!-- Leaf cluster 7 -->
      <g transform="translate(400, 50)" opacity="0.3" filter="url(#blur1)">
        <ellipse cx="0" cy="0" rx="35" ry="22" fill="#1A5A32" />
        <ellipse cx="-18" cy="-8" rx="30" ry="20" fill="#164A28" />
        <ellipse cx="15" cy="-5" rx="28" ry="18" fill="#1C5E36" />
        <ellipse cx="0" cy="15" rx="25" ry="16" fill="#123C22" />
        <ellipse cx="-22" cy="10" rx="25" ry="16" fill="#1A5A32" />
      </g>
      <!-- Leaf cluster 8 -->
      <g transform="translate(1050, 250)" opacity="0.3" filter="url(#blur2)">
        <ellipse cx="0" cy="0" rx="45" ry="28" fill="#1A5A32" />
        <ellipse cx="-22" cy="-10" rx="40" ry="25" fill="#164A28" />
        <ellipse cx="22" cy="-10" rx="38" ry="24" fill="#1C5E36" />
        <ellipse cx="0" cy="15" rx="35" ry="22" fill="#123C22" />
        <ellipse cx="-28" cy="8" rx="32" ry="20" fill="#1A5A32" />
        <ellipse cx="28" cy="10" rx="30" ry="18" fill="#226238" />
      </g>
      <!-- Leaf cluster 9 -->
      <g transform="translate(500, 500)" opacity="0.3" filter="url(#blur1)">
        <ellipse cx="0" cy="0" rx="35" ry="22" fill="#1A5A32" />
        <ellipse cx="-18" cy="-8" rx="30" ry="20" fill="#164A28" />
        <ellipse cx="15" cy="-5" rx="28" ry="18" fill="#1C5E36" />
        <ellipse cx="0" cy="15" rx="25" ry="16" fill="#123C22" />
      </g>
      <!-- Leaf cluster 10 -->
      <g transform="translate(100, 300)" opacity="0.3" filter="url(#blur2)">
        <ellipse cx="0" cy="0" rx="40" ry="25" fill="#1A5A32" />
        <ellipse cx="-20" cy="-10" rx="35" ry="22" fill="#164A28" />
        <ellipse cx="20" cy="-5" rx="30" ry="20" fill="#1C5E36" />
        <ellipse cx="5" cy="18" rx="28" ry="18" fill="#123C22" />
        <ellipse cx="-25" cy="12" rx="25" ry="16" fill="#1A5A32" />
      </g>
    </pattern>
  </defs>
  <rect width="1200" height="600" fill="url(#leafGrad2)" />
  <rect width="1200" height="600" fill="url(#leaves)" opacity="0.6" />
  <rect width="1200" height="600" fill="url(#leafGrad)" opacity="0.4" />
</svg>
