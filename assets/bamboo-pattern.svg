<svg xmlns="http://www.w3.org/2000/svg" width="600" height="200" viewBox="0 0 600 200">
  <defs>
    <linearGradient id="bambooGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B8860B" />
      <stop offset="50%" stop-color="#D4A545" />
      <stop offset="100%" stop-color="#8B6914" />
    </linearGradient>
    <pattern id="bamboo" x="0" y="0" width="200" height="200" patternUnits="userSpaceOnUse">
      <!-- Bamboo stalk -->
      <rect x="100" y="0" width="4" height="200" rx="2" fill="url(#bambooGrad)" opacity="0.6" />
      <rect x="280" y="30" width="4" height="150" rx="2" fill="url(#bambooGrad)" opacity="0.5" />
      <rect x="450" y="80" width="4" height="130" rx="2" fill="url(#bambooGrad)" opacity="0.55" />
      <rect x="120" y="70" width="4" height="140" rx="2" fill="url(#bambooGrad)" opacity="0.5" />
      <rect x="350" y="10" width="4" height="190" rx="2" fill="url(#bambooGrad)" opacity="0.45" />
      <rect x="500" y="120" width="4" height="90" rx="2" fill="url(#bambooGrad)" opacity="0.5" />
      <!-- Bamboo nodes -->
      <circle cx="100" cy="0" r="6" fill="url(#bambooGrad)" opacity="0.5" />
      <circle cx="100" cy="50" r="5" fill="url(#bambooGrad)" opacity="0.45" />
      <circle cx="100" cy="100" r="5" fill="url(#bambooGrad)" opacity="0.45" />
      <circle cx="100" cy="150" r="5" fill="url(#bambooGrad)" opacity="0.4" />
      <circle cx="280" cy="30" r="6" fill="url(#bambooGrad)" opacity="0.45" />
      <circle cx="280" cy="90" r="5" fill="url(#bambooGrad)" opacity="0.4" />
      <circle cx="280" cy="140" r="5" fill="url(#bambooGrad)" opacity="0.35" />
      <circle cx="450" cy="80" r="6" fill="url(#bambooGrad)" opacity="0.45" />
      <circle cx="450" cy="130" r="5" fill="url(#bambooGrad)" opacity="0.4" />
      <circle cx="120" cy="70" r="5" fill="url(#bambooGrad)" opacity="0.4" />
      <circle cx="120" cy="120" r="5" fill="url(#bambooGrad)" opacity="0.35" />
      <circle cx="350" cy="10" r="6" fill="url(#bambooGrad)" opacity="0.4" />
      <circle cx="350" cy="60" r="5" fill="url(#bambooGrad)" opacity="0.35" />
      <circle cx="350" cy="110" r="5" fill="url(#bambooGrad)" opacity="0.35" />
      <circle cx="500" cy="120" r="5" fill="url(#bambooGrad)" opacity="0.35" />
      <!-- Leaf decorations -->
      <g transform="translate(80, 40)" opacity="0.4">
        <path d="M0,0 Q20,30 40,0 Q20,-10 0,0 Z" fill="#1A4A2E" opacity="0.6" />
        <path d="M10,0 Q30,25 50,0 Q30,10 10,0 Z" fill="#226238" opacity="0.5" />
      </g>
      <g transform="translate(260, 100)" opacity="0.35">
        <path d="M0,0 Q20,28 40,0 Q20,-10 0,0 Z" fill="#1A4A2E" opacity="0.55" />
        <path d="M10,0 Q30,22 50,0 Q30,10 10,0 Z" fill="#226238" opacity="0.45" />
      </g>
      <g transform="translate(430, 140)" opacity="0.4">
        <path d="M0,0 Q20,30 40,0 Q20,-10 0,0 Z" fill="#1A4A2E" opacity="0.6" />
        <path d="M10,0 Q30,28 50,0 Q30,10 10,0 Z" fill="#226238" opacity="0.5" />
      </g>
      <g transform="translate(520, 50)" opacity="0.35">
        <path d="M0,0 Q18,25 36,0 Q18,-10 0,0 Z" fill="#1A4A2E" opacity="0.55" />
        <path d="M8,0 Q28,20 44,0 Q28,10 8,0 Z" fill="#226238" opacity="0.45" />
      </g>
      <g transform="translate(60, 150)" opacity="0.3">
        <path d="M0,0 Q18,22 36,0 Q18,-8 0,0 Z" fill="#1A4A2E" opacity="0.5" />
        <path d="M8,0 Q26,18 42,0 Q26,8 8,0 Z" fill="#226238" opacity="0.4" />
      </g>
      <g transform="translate(370, 180)" opacity="0.3">
        <path d="M0,0 Q16,20 32,0 Q16,-8 0,0 Z" fill="#1A4A2E" opacity="0.45" />
        <path d="M6,0 Q24,16 40,0 Q24,8 6,0 Z" fill="#226238" opacity="0.35" />
      </g>
      <!-- Woven texture lines -->
      <rect x="0" y="0" width="600" height="1" fill="#8B6914" opacity="0.15" />
      <rect x="0" y="99" width="600" height="1" fill="#8B6914" opacity="0.12" />
    </pattern>
  </defs>
  <rect width="600" height="200" fill="url(#bambooGrad)" opacity="0.15" />
  <rect width="600" height="200" fill="url(#bamboo)" />
</svg>
