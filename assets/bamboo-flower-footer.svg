<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600">
  <defs>
    <linearGradient id="footerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E5631"/>
      <stop offset="100%" stop-color="#0A2514"/>
    </linearGradient>
    <linearGradient id="footerGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D7A4A"/>
      <stop offset="100%" stop-color="#0A2514"/>
    </linearGradient>
    <filter id="softBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <!-- Bamboo stalk pattern -->
    <pattern id="bamboo" x="0" y="0" width="200" height="200" patternUnits="userSpaceOnUse">
      <!-- Bamboo stalks -->
      <rect x="100" y="0" width="6" height="200" rx="3" fill="url(#bambooGrad)" opacity="0.4"/>
      <rect x="150" y="20" width="5" height="180" rx="2.5" fill="url(#bambooGrad)" opacity="0.35"/>
      <rect x="300" y="10" width="6" height="190" rx="3" fill="url(#bambooGrad)" opacity="0.4"/>
      <rect x="400" y="50" width="5" height="160" rx="2.5" fill="url(#bambooGrad)" opacity="0.35"/>
      <rect x="600" y="0" width="6" height="200" rx="3" fill="url(#bambooGrad)" opacity="0.4"/>
      <rect x="700" y="30" width="5" height="170" rx="2.5" fill="url(#bambooGrad)" opacity="0.35"/>
      <rect x="900" y="10" width="6" height="190" rx="3" fill="url(#bambooGrad)" opacity="0.4"/>
      <rect x="1000" y="60" width="5" height="150" rx="2.5" fill="url(#bambooGrad)" opacity="0.35"/>
      <!-- Bamboo nodes -->
      <circle cx="103" cy="100" r="3" fill="#5A9E6F" opacity="0.3"/>
      <circle cx="153" cy="120" r="2.5" fill="#5A9E6F" opacity="0.25"/>
      <circle cx="303" cy="80" r="3" fill="#5A9E6F" opacity="0.3"/>
      <circle cx="403" cy="100" r="2.5" fill="#5A9E6F" opacity="0.25"/>
      <circle cx="603" cy="90" r="3" fill="#5A9E6F" opacity="0.3"/>
      <circle cx="703" cy="110" r="2.5" fill="#5A9E6F" opacity="0.25"/>
      <circle cx="903" cy="80" r="3" fill="#5A9E6F" opacity="0.3"/>
      <circle cx="1003" cy="100" r="2.5" fill="#5A9E6F" opacity="0.25"/>
    </pattern>
    <!-- Flower pattern -->
    <pattern id="flower" x="0" y="0" width="150" height="150" patternUnits="userSpaceOnUse">
      <!-- Lotus flower -->
      <ellipse cx="75" cy="75" rx="40" ry="30" fill="#2D7A4A" opacity="0.15"/>
      <ellipse cx="75" cy="75" rx="25" ry="18" fill="#2D7A4A" opacity="0.2"/>
      <ellipse cx="75" cy="75" rx="12" ry="8" fill="#2D7A4A" opacity="0.25"/>
      <!-- Petals -->
      <ellipse cx="75" cy="75" rx="18" ry="6" transform="rotate(0 75 75)" fill="#6BBF8F" opacity="0.5"/>
      <ellipse cx="75" cy="75" rx="18" ry="6" transform="rotate(45 75 75)" fill="#6BBF8F" opacity="0.5"/>
      <ellipse cx="75" cy="75" rx="18" ry="6" transform="rotate(90 75 75)" fill="#6BBF8F" opacity="0.5"/>
      <ellipse cx="75" cy="75" rx="18" ry="6" transform="rotate(135 75 75)" fill="#6BBF8F" opacity="0.5"/>
      <ellipse cx="75" cy="75" rx="18" ry="6" transform="rotate(180 75 75)" fill="#6BBF8F" opacity="0.5"/>
      <ellipse cx="75" cy="75" rx="18" ry="6" transform="rotate(225 75 75)" fill="#6BBF8F" opacity="0.5"/>
      <ellipse cx="75" cy="75" rx="18" ry="6" transform="rotate(270 75 75)" fill="#6BBF8F" opacity="0.5"/>
      <ellipse cx="75" cy="75" rx="18" ry="6" transform="rotate(315 75 75)" fill="#6BBF8F" opacity="0.5"/>
      <!-- Flower center -->
      <circle cx="75" cy="75" r="5" fill="#F5D063" opacity="0.6"/>
      <circle cx="75" cy="75" r="8" fill="#E8C04A" opacity="0.3"/>
      <!-- Small leaves -->
      <ellipse cx="30" cy="40" rx="10" ry="6" fill="#2D7A4A" opacity="0.2"/>
      <ellipse cx="120" cy="30" rx="8" ry="12" fill="#2D7A4A" opacity="0.15"/>
      <ellipse cx="40" cy="120" rx="12" ry="7" fill="#2D7A4A" opacity="0.15"/>
      <ellipse cx="110" cy="110" rx="7" ry="10" fill="#2D7A4A" opacity="0.15"/>
    </pattern>
  </defs>
  <!-- Background -->
  <rect width="1200" height="600" fill="url(#footerGrad)"/>
  <!-- Bamboo pattern overlay -->
  <rect width="1200" height="600" fill="url(#bamboo)" opacity="0.45"/>
  <!-- Flower pattern overlay -->
  <rect width="1200" height="600" fill="url(#flower)" opacity="0.3"/>
</svg>
