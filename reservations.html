<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Reserve a table across Lang Nuong Vietnam group restaurants. Choose a location, date, time and party size.">
  <title>Reservations | Lang Nuong Vietnam Group</title>
  <link rel="stylesheet" href="style.css?v=20260915-26">
  <style>
    :root{
      --tone-bg:#fffaf2;
      --tone-card:#ffffff;
      --tone-line:#e9d9bf;
      --tone-muted:#7a5a3a;
      --tone-title:#2a1810;
      --accent:#b7451d;
      --accent-soft:#f3e2d2;
      --step-bg:#faf5ee;
      --step-border:#e9d9bf;
      --shadow:0 1px 2px rgba(42,24,16,.06), 0 8px 24px -12px rgba(42,24,16,.18);
    }

    html{ background:#fffaf2; }
    body{
      background-image:linear-gradient(180deg, #fff7ed 0%, #fffaf2 40%, #fff 100%);
      background-attachment:fixed;
      margin:0;
    }

    .res-page{ padding-bottom:28px; }
    @media (max-width:560px){
      .res-page{ padding-bottom:20px; }
    }

    /* HEADER */
    .res-header{
      padding:36px 20px 24px;
      text-align:center;
      background:
        radial-gradient(1200px 220px at 50% -80px, rgba(183,69,29,.08), transparent 60%),
        linear-gradient(180deg, var(--tone-bg), #fff8ee);
      border-bottom:1px solid var(--tone-line);
    }
    @media (max-width:560px){
      .res-header{ padding:28px 16px 18px; }
    }
    .res-eyebrow{
      display:inline-block;
      font-size:12px;
      letter-spacing:.22em;
      text-transform:uppercase;
      color:var(--accent);
      background:var(--accent-soft);
      padding:.4rem .9rem;
      border-radius:999px;
      margin-bottom:14px;
    }
    .res-title{
      font-size:clamp(28px,4.4vw,44px);
      line-height:1.1;
      color:var(--tone-title);
      max-width:720px;
      margin:0 auto 10px;
    }
    .res-sub{
      color:var(--tone-muted);
      font-size:15px;
      max-width:520px;
      margin:0 auto;
    }

    /* SHELL */
    .res-shell{
      max-width:820px;
      margin:0 auto;
      padding:20px 16px 4px;
      display:grid;
      gap:16px;
    }
    @media (max-width:560px){
      .res-shell{ padding:16px 12px 2px; gap:14px; }
    }

    /* CARD */
    .res-card{
      background:var(--tone-card);
      border:1px solid var(--tone-line);
      border-radius:18px;
      padding:20px;
      box-shadow:var(--shadow);
    }
    @media (max-width:560px){
      .res-card{ padding:16px; border-radius:14px; }
    }
    .res-card h3{
      margin:0 0 14px;
      font-size:12px;
      text-transform:uppercase;
      letter-spacing:.18em;
      color:var(--tone-muted);
      font-weight:600;
    }

    /* PROGRESS */
    .progress{
      display:flex;
      align-items:center;
      gap:8px;
      margin:0 0 6px;
    }
    .progress-step{
      flex:1;
      display:flex;
      align-items:center;
      gap:8px;
    }
    .progress-dot{
      width:26px;
      height:26px;
      border-radius:50%;
      background:var(--step-bg);
      border:1px solid var(--step-border);
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:12px;
      font-weight:600;
      color:var(--tone-muted);
      flex:0 0 auto;
      transition:background .15s ease, color .15s ease, border-color .15s ease;
    }
    .progress-step.done .progress-dot{
      background:var(--accent);
      color:#fff;
      border-color:var(--accent);
    }
    .progress-step.active .progress-dot{
      background:var(--accent-soft);
      color:var(--accent);
      border-color:var(--accent);
    }
    .progress-label{
      font-size:12px;
      color:var(--tone-muted);
      text-transform:uppercase;
      letter-spacing:.06em;
    }
    .progress-step.active .progress-label{
      color:var(--tone-title);
      font-weight:600;
    }
    .progress-bar{
      flex:0 0 auto;
      width:24px;
      height:2px;
      background:var(--step-border);
      border-radius:2px;
    }
    .progress-step.done + .progress-step .progress-bar{
      background:var(--accent);
    }

    /* BUTTONS */
    .btn-primary{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:.5rem;
      border:none;
      background:var(--accent);
      color:#fff;
      font-weight:600;
      padding:.75rem 1.1rem;
      border-radius:999px;
      cursor:pointer;
      transition:transform .1s ease, box-shadow .15s ease, background .15s ease;
      box-shadow:0 6px 16px -8px rgba(183,69,29,.5);
      min-width:120px;
      font-size:14px;
    }
    @media (max-width:420px){
      .btn-primary{ width:100%; min-width:0; }
    }
    .btn-primary:hover:not(:disabled){ transform:translateY(-1px); background:#a03a17; box-shadow:0 10px 22px -10px rgba(183,69,29,.6); }
    .btn-primary:active:not(:disabled){ transform:translateY(0); }
    .btn-primary:disabled{ opacity:.55; cursor:not-allowed; transform:none; box-shadow:none; }
    .btn-outline{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:.5rem;
      border:1px solid var(--accent);
      background:#fff;
      color:var(--accent);
      font-weight:600;
      padding:.75rem 1.1rem;
      border-radius:999px;
      cursor:pointer;
      transition:background .15s ease, color .15s ease;
      min-width:120px;
      font-size:14px;
    }
    @media (max-width:420px){
      .btn-outline{ width:100%; min-width:0; }
    }
    .btn-outline:hover{ background:var(--accent); color:#fff; }

    .actions{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
      margin-top:16px;
      flex-wrap:wrap;
    }
    .actions .right{ display:flex; gap:10px; }
    @media (max-width:420px){
      .actions{
        flex-direction:column;
        align-items:stretch;
      }
      .actions .right{ flex-direction:column-reverse; }
    }

    /* SHOP PICKER */
    .shop-picker{
      display:grid;
      grid-template-columns:repeat(auto-fit, minmax(200px, 1fr));
      gap:12px;
    }
    @media (max-width:480px){
      .shop-picker{ grid-template-columns:1fr; }
    }
    .shop-opt{
      position:relative;
      border:1px solid var(--tone-line);
      background:#fff;
      border-radius:14px;
      padding:0;
      cursor:pointer;
      text-align:left;
      overflow:hidden;
      transition:border-color .15s ease, background .15s ease, transform .15s ease;
    }
    .shop-opt:hover{ border-color:#c8a572; transform:translateY(-1px); }
    .shop-opt[aria-selected="true"]{
      border-color:var(--accent);
      background:var(--accent-soft);
      box-shadow:0 0 0 3px rgba(183,69,29,.08);
    }
    .shop-opt .shop-thumb{
      width:100%;
      aspect-ratio:16/9;
      object-fit:cover;
      display:block;
      background:#f3e7d4;
      transition:transform .25s ease;
    }
    .shop-opt:hover .shop-thumb{ transform:scale(1.02); }
    .shop-opt .shop-body{ padding:10px 12px 12px; }
    .shop-name{
      font-weight:600;
      color:var(--tone-title);
      font-size:14px;
      line-height:1.25;
    }
    .shop-meta{
      font-size:11.5px;
      color:var(--tone-muted);
      margin-top:4px;
      line-height:1.4;
    }

    /* FIELD STACK */
    .field-stack{ display:grid; gap:18px; }
    .field-row{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:14px;
    }
    @media (max-width:560px){
      .field-row{ grid-template-columns:1fr; }
    }
    .field{
      display:grid;
      gap:6px;
    }
    .field > label{
      font-size:11.5px;
      text-transform:uppercase;
      letter-spacing:.1em;
      color:var(--tone-muted);
    }
    .field input,
    .field select,
    .field textarea{
      appearance:none;
      font:inherit;
      border:1px solid var(--tone-line);
      border-radius:10px;
      padding:.6rem .75rem;
      background:#fff;
      color:var(--tone-title);
      width:100%;
      transition:border-color .15s ease, box-shadow .15s ease;
      font-size:15px;
    }
    @media (max-width:560px){
      .field input,
      .field select,
      .field textarea{ font-size:16px; }
    }
    .field input:focus,
    .field select:focus,
    .field textarea:focus{
      outline:none;
      border-color:var(--accent);
      box-shadow:0 0 0 3px rgba(183,69,29,.15);
    }
    .field input::placeholder,
    .field textarea::placeholder{ color:#b59a7a; }

    .input-note{
      font-size:12px;
      color:var(--tone-muted);
      margin-top:4px;
      display:block;
    }

    /* TIME GRID */
    .time-grid{
      display:grid;
      grid-template-columns:repeat(auto-fill, minmax(96px, 1fr));
      gap:8px;
      margin-top:4px;
    }
    @media (max-width:420px){
      .time-grid{ grid-template-columns:repeat(3, 1fr); }
    }
    .time-opt{
      border:1px solid var(--tone-line);
      background:#fff;
      border-radius:10px;
      padding:.55rem .3rem;
      text-align:center;
      cursor:pointer;
      font-size:13px;
      color:var(--tone-title);
      transition:background .15s ease, color .15s ease, border-color .15s ease, transform .1s ease;
      -webkit-tap-highlight-color:transparent;
      touch-action:manipulation;
    }
    .time-opt:hover{ background:var(--accent-soft); border-color:#c8a572; }
    .time-opt:active{ transform:scale(.97); }
    .time-opt[aria-selected="true"]{
      background:var(--accent);
      color:#fff;
      border-color:var(--accent);
      box-shadow:0 4px 10px -4px rgba(183,69,29,.5);
    }
    .time-opt.unavailable{
      color:#b19a82;
      background:#faf5ee;
      border-style:dashed;
      cursor:not-allowed;
      text-decoration:line-through;
    }
    .time-opt.unavailable[aria-selected="true"]{ background:#b19a82; border-style:solid; }

    /* GUEST BLOCK (page 2) */
    .guest-block{
      display:grid;
      gap:14px;
    }
    .guest-block-head{
      display:flex;
      align-items:baseline;
      justify-content:space-between;
    }
    .guest-block-title{
      font-size:24px;
      font-weight:600;
      color:var(--tone-title);
    }
    .guest-add-children{
      font-size:13px;
      color:var(--tone-title);
      text-decoration:underline;
      text-underline-offset:2px;
      background:none;
      border:none;
      cursor:pointer;
      padding:0;
    }
    .guest-add-children:hover{ color:var(--accent); }

    .guest-block-adults,
    .guest-block-children{
      display:grid;
      grid-template-columns:auto 1fr;
      align-items:center;
      gap:14px;
    }
    .guest-block-children{
      grid-template-columns:auto 1fr;
      margin-top:4px;
    }
    .guest-block-label{
      font-size:20px;
      font-weight:600;
      color:var(--tone-title);
    }
    @media (max-width:520px){
      .guest-block-adults,
      .guest-block-children{
        grid-template-columns:1fr;
        gap:8px;
      }
      .guest-block-label{
        margin-bottom:6px;
        font-size:18px;
      }
    }

    .guest-stepper{
      display:flex;
      align-items:center;
      gap:10px;
    }
    .guest-steps{
      width:34px;
      height:34px;
      border-radius:50%;
      border:1px solid var(--tone-line);
      background:#fff;
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      color:var(--tone-title);
      font-size:18px;
      line-height:1;
      transition:background .15s ease, border-color .15s ease, transform .1s ease;
      touch-action:manipulation;
    }
    .guest-steps:hover{ background:var(--accent-soft); border-color:#c8a572; }
    .guest-steps:hover:not(:disabled){ transform:translateY(-1px); }
    .guest-steps:active:not(:disabled){ transform:translateY(0); }
    .guest-steps:disabled{ opacity:.45; cursor:not-allowed; }
    .guest-steps.minus:disabled{ background:#f3e2d2; border-color:var(--accent); }
    @media (max-width:520px){
      .guest-steps{ width:38px; height:38px; font-size:20px; }
    }

    .guest-count{
      width:56px;
      height:44px;
      text-align:center;
      font-size:18px;
      font-weight:600;
      border:1px solid var(--tone-line);
      border-radius:999px;
      background:#fff;
      color:var(--tone-title);
      padding:0;
      appearance:textfield;
      -moz-appearance:textfield;
    }
    @media (max-width:520px){
      .guest-count{ width:64px; height:48px; font-size:20px; }
    }
    .guest-count::-webkit-outer-spin-button,
    .guest-count::-webkit-inner-spin-button{
      -webkit-appearance:none;
      margin:0;
    }
    .guest-count:focus{
      outline:none;
      border-color:var(--accent);
      box-shadow:0 0 0 3px rgba(183,69,29,.15);
    }

    .guest-block-children.hidden,
    #guestChildrenBlock.hidden{
      display:none;
    }

    @media (max-width:560px){
      .guest-block-adults,
      .guest-block-children{
        grid-template-columns:1fr;
        gap:8px;
      }
      .guest-block-label{
        margin-bottom:6px;
      }
    }

    /* PERIOD PICKER */
    .period-list{
      display:grid;
      gap:8px;
    }
    .period-opt{
      display:grid;
      grid-template-columns:24px 1fr auto;
      gap:10px;
      align-items:center;
      border:1px solid var(--tone-line);
      background:#fff;
      border-radius:12px;
      padding:12px 14px;
      cursor:pointer;
      text-align:left;
      transition:border-color .15s ease, background .15s ease, transform .1s ease;
      -webkit-tap-highlight-color:transparent;
      touch-action:manipulation;
    }
    .period-opt:hover{ border-color:#c8a572; background:var(--accent-soft); }
    .period-opt:active{ transform:scale(.99); }
    .period-opt[aria-selected="true"]{
      border-color:var(--accent);
      background:var(--accent-soft);
      box-shadow:0 0 0 2px rgba(183,69,29,.12);
    }
    .period-opt .period-dot{
      width:22px;
      height:22px;
      border-radius:50%;
      border:1px solid var(--tone-line);
      background:#fff;
      display:flex;
      align-items:center;
      justify-content:center;
      color:var(--tone-muted);
      font-size:12px;
      font-weight:700;
      flex:0 0 auto;
      transition:background .15s ease, color .15s ease, border-color .15s ease;
    }
    .period-opt[aria-selected="true"] .period-dot{
      background:var(--accent);
      color:#fff;
      border-color:var(--accent);
    }
    .period-body{ display:grid; gap:2px; }
    .period-name{
      font-weight:600;
      color:var(--tone-title);
      font-size:14px;
    }
    .period-hours{
      font-size:12px;
      color:var(--tone-muted);
      font-variant-numeric:tabular-nums;
    }
    .period-empty{
      color:var(--tone-muted);
      font-size:13px;
      text-align:center;
      padding:14px;
    }

    /* PERIOD PICKED (bottom pop-in, no change button) */
    .period-picked{
      margin-top:16px;
      padding:12px 14px;
      background:var(--accent-soft);
      border:1px solid var(--accent);
      border-radius:12px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      color:var(--tone-title);
      font-size:14px;
      animation:popIn .28s cubic-bezier(.2,1,.2,1);
    }
    .period-picked .pt-name{ font-weight:600; }
    .period-picked .pt-hours{
      color:var(--tone-muted);
      font-variant-numeric:tabular-nums;
      font-size:12.5px;
    }
    .period-picked .pt-change{
      background:none;
      border:none;
      color:var(--accent);
      font-size:13px;
      font-weight:500;
      text-decoration:underline;
      text-underline-offset:2px;
      cursor:pointer;
      padding:0;
    }
    .period-picked .pt-change:hover{ color:#8a3614; }
    @keyframes popIn{
      from{
        opacity:0;
        transform:translateY(10px) scale(.97);
      }
      to{
        opacity:1;
        transform:translateY(0) scale(1);
      }
    }

    /* NOTE */
    .res-note{
      font-size:12.5px;
      color:var(--tone-muted);
      background:#faf5ee;
      border:1px dashed var(--tone-line);
      border-radius:10px;
      padding:.6rem .8rem;
      line-height:1.5;
    }

    /* SUMMARY */
    .res-summary{
      display:grid;
      gap:8px;
      padding:14px 16px;
      background:#faf5ee;
      border:1px solid var(--tone-line);
      border-radius:12px;
    }
    .res-summary .row{
      display:flex;
      justify-content:space-between;
      gap:12px;
      font-size:13.5px;
      color:var(--tone-title);
      align-items:baseline;
    }
    .res-summary .row span:last-child{
      color:var(--tone-muted);
      font-variant-numeric:tabular-nums;
    }
    .res-summary .row .status.ready{ color:var(--accent); font-weight:600; }

    /* SIDE BAR (page 3) */
    .booking-layout{
      display:grid;
      grid-template-columns:1fr 280px;
      gap:20px;
      align-items:start;
    }
    @media (max-width:760px){
      .booking-layout{ grid-template-columns:1fr; }
      .booking-sidebar{ order:-1; }
    }
    @media (max-width:480px){
      .booking-layout{ grid-template-columns:1fr; gap:14px; }
      .booking-sidebar{ position:static; }
      .booking-sidebar .res-card{ padding:16px; }
    }
    .booking-sidebar{
      position:sticky;
      top:12px;
    }
    .booking-sidebar .res-card{ padding:18px; }
    .booking-sidebar .res-summary .row{
      font-size:13px;
    }

    /* CHECKBOX */
    .check-row{
      display:grid;
      gap:8px;
      align-items:flex-start;
    }
    .check-row input[type="checkbox"]{
      appearance:none;
      width:20px;
      height:20px;
      border:1px solid var(--tone-line);
      border-radius:6px;
      background:#fff;
      flex:0 0 auto;
      margin-top:2px;
      cursor:pointer;
      transition:background .15s ease, border-color .15s ease;
      display:inline-block;
      position:relative;
    }
    .check-row input[type="checkbox"]:checked{
      background:var(--accent);
      border-color:var(--accent);
    }
    .check-row input[type="checkbox"]:checked::after{
      content:"";
      position:absolute;
      left:5px;
      top:1px;
      width:6px;
      height:11px;
      border:solid #fff;
      border-width:0 2px 2px 0;
      transform:rotate(45deg);
    }
    .check-row input[type="checkbox"]:focus-visible{
      outline:2px solid var(--accent);
      outline-offset:2px;
    }
    .check-label{
      font-size:14px;
      color:var(--tone-title);
      line-height:1.4;
    }
    .check-label .legal{
      display:block;
      font-size:12px;
      color:var(--tone-muted);
      margin-top:6px;
    }

    /* SUCCESS PAGE */
    .success-card{
      text-align:center;
      padding:36px 22px;
    }
    .success-icon{
      width:64px;
      height:64px;
      border-radius:50%;
      background:var(--accent-soft);
      border:2px solid var(--accent);
      display:flex;
      align-items:center;
      justify-content:center;
      margin:0 auto 18px;
      color:var(--accent);
    }
    .success-title{
      font-size:clamp(24px,3.6vw,34px);
      color:var(--tone-title);
      margin:0 0 10px;
      line-height:1.15;
    }
    .success-sub{
      color:var(--tone-muted);
      font-size:15px;
      max-width:460px;
      margin:0 auto 6px;
    }
    .success-details{
      display:grid;
      gap:8px;
      padding:14px 16px;
      background:#faf5ee;
      border:1px solid var(--tone-line);
      border-radius:12px;
      text-align:left;
      margin:22px auto 0;
      max-width:460px;
    }
    .success-details .row{
      display:flex;
      justify-content:space-between;
      gap:12px;
      font-size:13.5px;
      color:var(--tone-title);
    }
    .success-details .row span:last-child{
      color:var(--tone-muted);
      font-variant-numeric:tabular-nums;
    }
    .success-actions{
      display:flex;
      justify-content:center;
      gap:12px;
      margin-top:24px;
      flex-wrap:wrap;
    }
    .success-actions .btn-outline{
      border-color:var(--tone-line);
      color:var(--tone-title);
    }
    .success-actions .btn-outline:hover{
      background:var(--tone-line);
      color:#fff;
    }
    .success-actions .btn-outline:disabled{
      opacity:.5;
      cursor:not-allowed;
      background:#fff;
      color:var(--tone-title);
    }

    .hidden{ display:none !important; }
    .sr-only{
      position:absolute;
      width:1px; height:1px;
      padding:0; margin:-1px;
      overflow:hidden;
      clip:rect(0,0,0,0);
      white-space:nowrap;
      border:0;
    }
    .toast{
      position:fixed;
      left:50%;
      bottom:24px;
      transform:translateX(-50%);
      background:var(--tone-title);
      color:#fffaf2;
      padding:.7rem 1.1rem;
      border-radius:999px;

  <script>

    // ===== TIME PERIODS =====
    const PERIODS = [
      { id:'all', name:'All timeslots', hours:'8:00 AM – 11:59 PM' },
      { id:'breakfast', name:'Breakfast', hours:'8:00 AM – 10:30 AM' },
      { id:'lunch', name:'Lunch', hours:'10:31 AM – 3:45 PM' },
      { id:'dinner', name:'Dinner', hours:'3:46 PM – 8:45 PM' },
      { id:'late', name:'Late', hours:'8:46 PM – 11:59 PM' }
    ];

    const RES_HOUSE_RULES_URL = 'terms.html';

    // ===== PAGE ORDER =====
    const PAGES = [
      { id:'shop', label:'Restaurant' },
      { id:'datetime', label:'Date & time' },
      { id:'contact', label:'Your details' },
      { id:'review', label:'Review' },
      { id:'done', label:'Done' }
    ];

    // ===== DOM REFS =====
    const shell = document.getElementById('resShell');
    const toastEl = document.getElementById('toast');


    // ===== STATE =====
    let currentPage = 0;
    let selectedShop = SHOPS[0];
    let selectedDate = '';
    let selectedTime = '';
    let selectedPeriodId = 'all';
    let email = '';
    let salutation = '';
    let firstName = '';
    let lastName = '';
    let phone = '';
    let specialRequests = '';
    let acceptedHouseRules = false;
    let submittedReservation = null;

    // ===== HELPERS =====
    function pad(n){ return n < 10 ? '0'+n : ''+n; }
    function todayISO(){
      const d = new Date();
      return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
    }
    function formatDate(iso){
      if(!iso) return '—';
      const d = new Date(iso + 'T00:00:00');
      if(isNaN(d.getTime())) return '—';
      return d.toLocaleDateString('en-SG', { weekday:'long', day:'numeric', month:'long', year:'numeric' });
    }
    function parseTimeLabel(lbl){
      const m = lbl.match(/^(\d{1,2}):(\d{2})\s*(AM|PM)$/i);
      if(!m) return null;
      let h = parseInt(m[1],10), min = parseInt(m[2],10);
      if(m[3].toUpperCase() === 'PM' && h !== 12) h += 12;
      if(m[3].toUpperCase() === 'AM' && h === 12) h = 0;
      return { hour:h, minute:min };
    }
    function timeFromLabel(lbl, dateIso){
      const t = parseTimeLabel(lbl);
      if(!t || !dateIso) return null;
      return new Date(dateIso + 'T' + pad(t.hour) + ':' + pad(t.minute) + ':00');
    }
    function isTodaySelected(){
      return selectedDate === todayISO();
    }
    function isValidEmail(raw){
      if(!raw) return false;
      return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(raw.trim());
    }

    // ===== RENDER =====
    function render(){
      renderProgress();
      renderPage(currentPage);
      updateBackState();
      window.scrollTo({ top:0, behavior:'smooth' });
    }

    function renderProgress(){
      const steps = PAGES.map((p, i) => ({
        id:p.id,
        label:p.label,
        done:i < currentPage,
        active:i === currentPage
      }));
      const html = steps.map((s, i) => {
        const cls = s.done ? 'done' : (s.active ? 'active' : '');
        const bar = i < steps.length - 1
          ? `<span class="progress-bar"></span>`
          : '';
        return `
          <div class="progress-step ${cls}">
            <span class="progress-dot" aria-hidden="true">${s.done ? '✓' : (i+1)}</span>
            <span class="progress-label">${s.label}</span>
          </div>
          ${bar}`;
      }).join('');
      const wrap = document.createElement('div');
      wrap.className = 'progress';
      wrap.setAttribute('aria-label','Reservation progress');
      wrap.innerHTML = html;
      shell.prepend(wrap);
    }

    function renderPage(idx){
      // clear shell except the progress bar (first child)
      while (shell.children.length > 0){
        shell.removeChild(shell.firstChild);
      }
      renderProgress();
      const page = PAGES[idx];
      switch(page.id){
        case 'shop': renderShopPage(); break;
        case 'datetime': renderDateTimePage(); break;
        case 'contact': renderContactPage(); break;
        case 'review': renderReviewPage(); break;
        case 'done': renderDonePage(); break;
      }
    }

    function updateBackState(){
      const back = document.getElementById('backBtn');
      if(!back) return;
      back.disabled = currentPage === 0;
      if(currentPage === 0){
        back.style.visibility = 'hidden';
      } else {
        back.style.visibility = '';
      }
    }

    // ---------- PAGE 1: SHOP ----------
    function renderShopPage(){
      const card = document.createElement('section');
      card.className = 'res-card';
      card.setAttribute('aria-labelledby','shopLabel');
      card.innerHTML = `
        <h3 id="shopLabel">Select a restaurant</h3>
        <div class="shop-picker" id="shopPicker" role="radiogroup" aria-label="Restaurant locations"></div>
        <p class="res-note" id="shopHelp">Every location uses the same table-reservation booking form. After you choose a date and time, the restaurant will confirm your table.</p>
      `;
      shell.appendChild(card);

      const picker = document.getElementById('shopPicker');
      picker.innerHTML = '';
      SHOPS.forEach((shop, i) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'shop-opt';
        btn.setAttribute('role','radio');
        btn.setAttribute('aria-checked', shop.id === selectedShop.id ? 'true' : 'false');
        btn.setAttribute('aria-selected', shop.id === selectedShop.id ? 'true' : 'false');
        btn.dataset.id = shop.id;

        const thumb = document.createElement('img');
        thumb.className = 'shop-thumb';
        thumb.alt = '';
        thumb.src = shop.thumb;
        thumb.loading = 'lazy';
        thumb.onerror = function(){ this.src = PLACEHOLDER_BY_ID[shop.id] || ''; };
        btn.appendChild(thumb);

        const body = document.createElement('div');
        body.className = 'shop-body';

        const name = document.createElement('div');
        name.className = 'shop-name';
        name.textContent = shop.name;
        body.appendChild(name);

        const meta = document.createElement('div');
        meta.className = 'shop-meta';
        meta.textContent = shop.address + ' · ' + shop.open;
        body.appendChild(meta);

        btn.appendChild(body);
        btn.addEventListener('click', () => selectShop(shop));
        picker.appendChild(btn);
      });

      const actions = document.createElement('div');
      actions.className = 'actions';
      actions.innerHTML = `         <button type="button" class="btn-outline" id="backBtn" disabled>Back</button>
        <div class="right">
          <button type="button" class="btn-primary" id="nextBtn">Continue</button>
        </div>
      `;
      shell.appendChild(actions);

      document.getElementById('nextBtn').addEventListener('click', () => {
        if(!selectedShop){ showToast('Please choose a restaurant.'); return; }
        goNext();
      });
      document.getElementById('backBtn').addEventListener('click', goBack);
    }

    function selectShop(shop){
      selectedShop = shop;
      selectedTime = '';
      document.querySelectorAll('#shopPicker .shop-opt').forEach(b => {
        const on = b.dataset.id === shop.id;
        b.setAttribute('aria-selected', on ? 'true' : 'false');
        b.setAttribute('aria-checked', on ? 'true' : 'false');
      });
    }

    // ---------- PAGE 2: DATE / TIME / GUESTS ----------
    function renderDateTimePage(){
      const main = document.createElement('section');
      main.className = 'res-card';
      main.setAttribute('aria-labelledby','datetimeLabel');
      main.innerHTML = `
        <h3 id="datetimeLabel">When and how many</h3>
        <p class="input-note" style="margin:-6px 0 14px;">Pick a date first — the available times and period picker will show once you do.</p>
        <div class="field-stack">
          <div class="field">
            <label for="resDate">Date</label>
            <input type="date" id="resDate" min="">
            <span class="input-note" id="dateNote">Pick the day you’d like to dine with us.</span>
          </div>

          <div class="field">
            <label>Timeslots</label>
            <div id="timeGrid" class="time-grid" aria-label="Available times"></div>
          </div>

          <div class="res-note hidden" id="noDateNote">Pick a date first to see available times and period options.</div>

          <div class="field">
            <label for="resTime">Time <span style="text-transform:none; letter-spacing:0; font-weight:400;">(select)</span></label>
            <input type="text" id="resTime" readonly placeholder="Select a time below" aria-describedby="timeHelp">
          </div>
          <div id="timeHelp" class="sr-only">Available reservation times for the selected date. Choose one slot.</div>

          <div id="periodSlot" class="hidden"></div>

          <div class="field">
            <label for="guestExact">Guests</label>
            <input type="number" id="guestExact" min="2" max="20" value="2" inputmode="numeric" aria-describedby="guestNote">
            <span class="input-note" id="guestNote">For parties larger than 20, contact us.</span>
          </div>
        </div>
      `;
      shell.appendChild(main);

      const dateField = document.getElementById('resDate');
      const timeField = document.getElementById('resTime');
      const timeGrid = document.getElementById('timeGrid');
      const periodSlot = document.getElementById('periodSlot');
      const periodPicked = document.getElementById('periodPicked');
      const guestExact = document.getElementById('guestExact');
      const guestNote = document.getElementById('guestNote');
      const noDateNote = document.getElementById('noDateNote');
      const backBtn = document.getElementById('backBtn');

      // set date min
      const minDate = new Date();
      minDate.setDate(minDate.getDate() - 1);
      dateField.min = minDate.toISOString().slice(0,10);
      if(!selectedDate || selectedDate < dateField.min){
        selectedDate = todayISO();
      }
      dateField.value = selectedDate;

      // guests start at 2
      guestExact.value = 2;
      backBtn.disabled = true;
      updatePeriodPicked(periodPicked);

      renderTimeGrid(timeGrid, timeField);
      renderPeriodPicker(periodSlot);

      // disable date-only fields until a date is chosen
      if(!selectedDate){
        periodSlot.classList.add('hidden');
        noDateNote.classList.remove('hidden');
        timeField.value = 'Pick a date first';
        noDateNote.classList.remove('hidden');
      } else {
        noDateNote.classList.add('hidden');
      }

      dateField.addEventListener('change', () => {
        selectedDate = dateField.value;
        selectedTime = '';
        timeField.value = 'Select a time below';
        renderTimeGrid(timeGrid, timeField);
        renderPeriodPicker(periodSlot);
        if(selectedDate){
          periodSlot.classList.remove('hidden');
          noDateNote.classList.add('hidden');
        } else {
          periodSlot.classList.add('hidden');
          noDateNote.classList.remove('hidden');
        }
        updatePeriodPicked(periodPicked);
      });

      timeGrid.querySelectorAll('.time-opt').forEach(btn => {
        btn.addEventListener('click', () => {
          if(btn.classList.contains('unavailable')) return;
          selectedTime = btn.textContent;
          renderTimeGrid(timeGrid, timeField);
          timeField.value = selectedTime;
          updatePeriodPicked(periodPicked);
        });
      });

      guestExact.addEventListener('input', () => {
        let v = parseInt(guestExact.value, 10);
        if(isNaN(v) || v < 2) v = 2;
        if(v > 20) v = 20;
        guestExact.value = v;
      });

      guestExact.addEventListener('change', () => {
        let v = parseInt(guestExact.value, 10);
        if(isNaN(v) || v < 2) v = 2;
        if(v > 20) v = 20;
        guestExact.value = v;
      });

      // enable Back once page 2 has a restaurant, date and time
      function updatePageTwoBack(){
        if(selectedShop && selectedDate && selectedTime){
          if(backBtn) backBtn.disabled = false;
        }
      }

      // period selection — pick directly, no change button
      periodSlot.querySelectorAll('.period-opt').forEach(el => {
        el.addEventListener('click', () => {
          selectedPeriodId = el.dataset.period;
          renderPeriodPicker(periodSlot);
          updatePeriodPicked(periodPicked);
        });
      });

      // disable date-only fields until a date is chosen
      if(!selectedDate){
        periodSlot.classList.add('hidden');
        noDateNote.classList.remove('hidden');
        timeField.value = 'Pick a date first';
      } else {
        noDateNote.classList.add('hidden');
      }

      // buttons
      const actions = document.createElement('div');
      actions.className = 'actions';
      actions.innerHTML = `         <button type="button" class="btn-outline" id="backBtn" disabled>Back</button>
        <div class="right">
          <button type="button" class="btn-primary" id="nextBtn">Continue</button>
        </div>
      `;
      shell.appendChild(actions);

      const nextBtn = document.getElementById('nextBtn');
      nextBtn.addEventListener('click', () => {
        if(!selectedShop){ showToast('Please choose a restaurant.'); return; }
        if(!selectedDate){ showToast('Please pick a date.'); return; }
        const total = parseInt(guestExact.value, 10);
        if(isNaN(total) || total < 1){ showToast('Please enter at least 1 guest.'); return; }
        if(total > 20){ showToast('A party can have up to 20 guests.'); return; }
        goNext();
      });
      document.getElementById('backBtn').addEventListener('click', goBack);
    }

    function renderTimeGrid(timeGrid, timeField){
      timeGrid.innerHTML = '';
      if(!selectedShop || !selectedDate){
        const empty = document.createElement('div');
        empty.className = 'res-note';
        empty.textContent = 'Select a restaurant and a date to see available times.';
        timeGrid.appendChild(empty);
        return;
      }

      selectedShop.times.forEach((t, idx) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'time-opt';
        btn.textContent = t;
        btn.dataset.index = idx;
        btn.setAttribute('aria-label', t);

        if(isTodaySelected()){
          const tDate = timeFromLabel(t, selectedDate);
          if(tDate && tDate <= new Date()){
            btn.classList.add('unavailable');
            btn.setAttribute('aria-disabled','true');
            btn.title = 'No longer available';
          }
        }

        if(selectedTime === t){
          btn.setAttribute('aria-selected','true');
        } else {
          btn.removeAttribute('aria-selected');
        }
        timeGrid.appendChild(btn);
      });
    }

    function renderGuestPresets(container, breakdown, adultsEl, childrenEl, exactEl, minusEl, plusEl){
      container.innerHTML = '';
      const presets = [2,3,4,5,6,8,10,12,14,16,18,20];
      presets.forEach(n => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'guest-chip';
        btn.setAttribute('role','radio');
        btn.dataset.count = n;
        btn.setAttribute('aria-checked', n === parseInt(exactEl.value,10) ? 'true' : 'false');
        btn.setAttribute('aria-selected', n === parseInt(exactEl.value,10) ? 'true' : 'false');

        const count = document.createElement('span');
        count.className = 'count';
        count.textContent = n;
        btn.appendChild(count);
        container.appendChild(btn);

        btn.addEventListener('click', () => {
          exactEl.value = n;
          adultsEl.value = n;
          childrenEl.value = 0;
          const a = parseInt(adultsEl.value,10) || 0;
          const c = parseInt(childrenEl.value,10) || 0;
          adultsEl.value = a;
          childrenEl.value = c;
          guestCountFromBreakdowns();
          updateMinusButton(minusEl, exactEl);
          container.querySelectorAll('.guest-chip').forEach(el => {
            const on = parseInt(el.dataset.count,10) === n;
            el.setAttribute('aria-selected', on ? 'true' : 'false');
            el.setAttribute('aria-checked', on ? 'true' : 'false');
          });
        });
      });
    }

    function totalGuests(){
      const el = document.getElementById('guestExact');
      if(!el) return 2;
      const v = parseInt(el.value, 10);
      if(isNaN(v) || v < 1) return 2;
      if(v > 20) return 20;
      return v;
    }



    function updateChildMinusButton(){
      const minusEl = document.getElementById('childMinus');
      const c = Math.max(0, parseInt(document.getElementById('guestChildren').value,10) || 0);
      const disabled = c <= 0;
      minusEl.disabled = disabled;
      minusEl.setAttribute('aria-disabled', disabled ? 'true' : 'false');
      if(disabled){
        minusEl.classList.add('minus');
      } else {
        minusEl.classList.remove('minus');
      }
    }

    function renderPeriodPicker(container){
      container.innerHTML = '';
      container.classList.remove('hidden');
      PERIODS.forEach(p => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'period-opt';
        btn.dataset.period = p.id;
        btn.setAttribute('aria-selected', p.id === selectedPeriodId ? 'true' : 'false');
        btn.setAttribute('role','radio');

        const dot = document.createElement('span');
        dot.className = 'period-dot';
        dot.textContent = PERIODS.indexOf(p) + 1;
        btn.appendChild(dot);

        const body = document.createElement('div');
        body.className = 'period-body';
        const name = document.createElement('div');
        name.className = 'period-name';
        name.textContent = p.name;
        body.appendChild(name);
        const hours = document.createElement('div');
        hours.className = 'period-hours';
        hours.textContent = p.hours;
        body.appendChild(hours);

        btn.appendChild(body);
        container.appendChild(btn);
      });
    }

    function updatePeriodPicked(pickedEl){
      const p = PERIODS.find(x => x.id === selectedPeriodId) || PERIODS[0];
      pickedEl.innerHTML = `
        <span>
          <span class="pt-name">${p.name}</span>
          <span class="pt-hours"> — ${p.hours}</span>
        </span>
        <button type="button" class="pt-change" id="changePeriodBtn">Change</button>
      `;
      pickedEl.classList.remove('hidden');
      document.getElementById('changePeriodBtn').addEventListener('click', () => {
        pickedEl.classList.add('hidden');
      });
    }

    function renderContactSummary(){
      const shopEl = document.getElementById('sumShop');
      const dateEl = document.getElementById('sumDate');
      const timeEl = document.getElementById('sumTime');
      const guestsEl = document.getElementById('sumGuests');
      const periodEl = document.getElementById('sumPeriod');
      const statusEl = document.getElementById('sumStatus');
      if(!shopEl) return;

      shopEl.textContent = selectedShop ? selectedShop.name : '—';
      dateEl.textContent = formatDate(selectedDate);
      timeEl.textContent = selectedTime || '—';
      const total = totalGuests();
      guestsEl.textContent = total + ' guest' + (total === 1 ? '' : 's');
      const p = PERIODS.find(x => x.id === selectedPeriodId);
      periodEl.textContent = p ? p.name : '—';

      const emailOk = isValidEmail(email);
      if(!selectedShop || !selectedDate || !selectedTime){
        statusEl.textContent = 'Awaiting time';
      } else if(!emailOk){
        statusEl.textContent = 'Add a valid email';
      } else if(!firstName || !lastName){
        statusEl.textContent = 'Add your name';
      } else {
        statusEl.textContent = 'Ready to send';
        statusEl.classList.add('ready');
      }
    }

    // ---------- PAGE 3: CONTACT ----------
    function renderContactPage(){
      const main = document.createElement('section');
      main.className = 'res-card';
      main.setAttribute('aria-labelledby','contactLabel');
      main.innerHTML = `
        <h3 id="contactLabel">Your details</h3>
        <p class="input-note" style="margin:-6px 0 14px;">This is the contact you want the restaurant to confirm with.</p>
        <div class="booking-layout">
          <div>
            <div class="field-stack">
              <div class="field">
                <label for="resEmail">Email</label>
                <input type="email" id="resEmail" placeholder="you@example.com" autocomplete="email" inputmode="email">
                <span class="input-note" id="emailNote">We only use this to send the confirmation detail.</span>
              </div>

              <div class="field-row">
                <div class="field">
                  <label for="salutation">Salutation</label>
                  <select id="salutation">
                    <option value="">Choose…</option>
                    <option value="Mr">Mr</option>
                    <option value="Ms">Ms</option>
                    <option value="Mrs">Mrs</option>
                    <option value="Miss">Miss</option>
                    <option value="Mx">Mx</option>
                  </select>
                </div>
                <div class="field">
                  <label for="firstName">First name</label>
                  <input type="text" id="firstName" placeholder="First name" autocomplete="given-name">
                </div>
              </div>

              <div class="field">
                <label for="lastName">Last name</label>
                <input type="text" id="lastName" placeholder="Last name" autocomplete="family-name">
              </div>

              <div class="field">
                <label for="resPhone">Phone (for confirmation)</label>
                <input type="tel" id="resPhone" placeholder="+65 9000 0000" autocomplete="tel" inputmode="tel">
                <span class="input-note" id="phoneNote">Optional. We may use this to confirm your table if email fails.</span>
              </div>

              <div class="field">
                <label for="specialRequests">Special requests <span style="text-transform:none; letter-spacing:0; font-weight:400;">(optional)</span></label>
                <textarea id="specialRequests" rows="3" placeholder="Allergies, seating preference, celebration, etc."></textarea>
              </div>
            </div>
          </div>

          <aside class="booking-sidebar">
            <div class="res-card">
              <h3 style="margin-bottom:12px;">Booking summary</h3>
              <div class="res-summary" id="resSummary">
                <div class="row"><span>Restaurant</span><span id="sumShop">—</span></div>
                <div class="row"><span>Date</span><span id="sumDate">—</span></div>
                <div class="row"><span>Time</span><span id="sumTime">—</span></div>
                <div class="row"><span>Guests</span><span id="sumGuests">—</span></div>
                <div class="row"><span>Period</span><span id="sumPeriod">—</span></div>
                <div class="row"><span>Status</span><span id="sumStatus">Awaiting time</span></div>
              </div>
            </div>
          </aside>
        </div>
      `;
      shell.appendChild(main);

      const emailField = document.getElementById('resEmail');
      const salutationField = document.getElementById('salutation');
      const firstNameField = document.getElementById('firstName');
      const lastNameField = document.getElementById('lastName');
      const phoneField = document.getElementById('resPhone');
      const specialField = document.getElementById('specialRequests');

      emailField.value = email;
      salutationField.value = salutation;
      firstNameField.value = firstName;
      lastNameField.value = lastName;
      phoneField.value = phone;
      specialField.value = specialRequests;

      updateContactSummary();

      emailField.addEventListener('input', () => {
        email = emailField.value.trim();
        updateContactSummary();
      });
      salutationField.addEventListener('change', () => {
        salutation = salutationField.value;
        updateContactSummary();
      });
      firstNameField.addEventListener('input', () => {
        firstName = firstNameField.value.trim();
        updateContactSummary();
      });
      lastNameField.addEventListener('input', () => {
        lastName = lastNameField.value.trim();
        updateContactSummary();
      });
      phoneField.addEventListener('input', () => {
        phone = phoneField.value.trim();
        updateContactSummary();
      });
      specialField.addEventListener('input', () => {
        specialRequests = specialField.value.trim();
        updateContactSummary();
      });

      const actions = document.createElement('div');
      actions.className = 'actions';
      actions.innerHTML = `         <button type="button" class="btn-outline" id="backBtn" disabled>Back</button>
        <div class="right">
          <button type="button" class="btn-primary" id="nextBtn">Continue</button>
        </div>
      `;
      shell.appendChild(actions);

      document.getElementById('nextBtn').addEventListener('click', () => {
        if(!isValidEmail(email)){ showToast('Please add a valid email address.'); emailField.focus(); return; }
        if(!firstName){ showToast('Please enter your first name.'); firstNameField.focus(); return; }
        if(!lastName){ showToast('Please enter your last name.'); lastNameField.focus(); return; }
        goNext();
      });
      document.getElementById('backBtn').addEventListener('click', goBack);
    }

    function updateContactSummary(){
      const shopEl = document.getElementById('sumShop');
      const dateEl = document.getElementById('sumDate');
      const timeEl = document.getElementById('sumTime');
      const guestsEl = document.getElementById('sumGuests');
      const periodEl = document.getElementById('sumPeriod');
      const statusEl = document.getElementById('sumStatus');
      if(!shopEl) return;

      shopEl.textContent = selectedShop ? selectedShop.name : '—';
      dateEl.textContent = formatDate(selectedDate);
      timeEl.textContent = selectedTime || '—';
      const total = totalGuests();
      guestsEl.textContent = total + ' guest' + (total === 1 ? '' : 's');
      const p = PERIODS.find(x => x.id === selectedPeriodId);
      periodEl.textContent = p ? p.name : '—';

      const emailOk = isValidEmail(email);
      if(!selectedShop || !selectedDate || !selectedTime){
        statusEl.textContent = 'Awaiting details';
      } else if(!emailOk){
        statusEl.textContent = 'Add a valid email';
      } else if(!firstName || !lastName){
        statusEl.textContent = 'Add your name';
      } else {
        statusEl.textContent = 'Ready to send';
        statusEl.classList.add('ready');
      }
    }    // ---------- PAGE 4: REVIEW ----------
    function renderReviewPage(){
      const main = document.createElement('section');
      main.className = 'res-card';
      main.setAttribute('aria-labelledby','reviewLabel');
      main.innerHTML = `
        <h3 id="reviewLabel">Review and send</h3>
        <div class="field-stack">
          <div class="res-summary" style="background:#faf5ee;">
            <div class="row"><span>Restaurant</span><span id="rShop">—</span></div>
            <div class="row"><span>Date</span><span id="rDate">—</span></div>
            <div class="row"><span>Time</span><span id="rTime">—</span></div>
            <div class="row"><span>Guests</span><span id="rGuests">—</span></div>
            <div class="row"><span>Period</span><span id="rPeriod">—</span></div>
            <div class="row"><span>Contact</span><span id="rContact">—</span></div>
          </div>

          <div class="check-row">
            <input type="checkbox" id="houseRulesCheck">
            <label class="check-label" for="houseRulesCheck">
              I have read and accept the house rules &amp; policies.
              <span class="legal">The restaurant will hold your table for up to 15 minutes past your reservation time.</span>
            </label>
          </div>

          <p class="res-note" id="reviewNote">
            By sending this request, you’re asking the restaurant to hold a table for you. No booking is committed until the restaurant confirms.
          </p>
        </div>
      `;
      shell.appendChild(main);

      document.getElementById('rShop').textContent = selectedShop ? selectedShop.name : '—';
      document.getElementById('rDate').textContent = formatDate(selectedDate);
      document.getElementById('rTime').textContent = selectedTime || '—';
      const total = totalGuests();
      document.getElementById('rGuests').textContent = total + ' guest' + (total === 1 ? '' : 's');
      const p = PERIODS.find(x => x.id === selectedPeriodId);
      document.getElementById('rPeriod').textContent = p ? p.name : '—';
      document.getElementById('rContact').textContent = email || '—';

      const check = document.getElementById('houseRulesCheck');
      check.checked = acceptedHouseRules;
      check.addEventListener('change', () => {
        acceptedHouseRules = check.checked;
      });

      const actions = document.createElement('div');
      actions.className = 'actions';
      actions.style.justifyContent = 'flex-end';
      actions.innerHTML = `         <button type="button" class="btn-outline" id="backBtn" disabled>Back</button>
        <button type="button" class="btn-primary" id="submitBtn">Send reservation</button>
      `;
      shell.appendChild(actions);

      document.getElementById('backBtn').addEventListener('click', goBack);
      document.getElementById('submitBtn').addEventListener('click', () => {
        if(!acceptedHouseRules){
          showToast('Please accept the house rules & policies to continue.');
          check.focus();
          return;
        }
        submitReservation();
      });
    }

    // ---------- PAGE 5: DONE ----------
    function renderDonePage(){
      const main = document.createElement('section');
      main.className = 'res-card success-card';
      main.setAttribute('aria-labelledby','doneLabel');
      main.innerHTML = `
        <div class="success-icon" aria-hidden="true">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 6 9 17l-5-5"/>
          </svg>
        </div>
        <h2 class="success-title" id="doneLabel">Your reservation has been sent!</h2>
        <p class="success-sub">Thank you for choosing Lang Nuong. The restaurant will confirm your table soon.</p>

        <div class="success-details" id="doneDetails">
          <div class="row"><span>Restaurant</span><span id="dShop">—</span></div>
          <div class="row"><span>Date</span><span id="dDate">—</span></div>
          <div class="row"><span>Time</span><span id="dTime">—</span></div>
          <div class="row"><span>Guests</span><span id="dGuests">—</span></div>
          <div class="row"><span>Period</span><span id="dPeriod">—</span></div>
          <div class="row"><span>Confirmation sent to</span><span id="dEmail">—</span></div>
        </div>

        <div class="success-actions">
          <button type="button" class="btn-primary" id="newBtn">Make another reservation</button>
          <button type="button" class="btn-outline" id="cancelBtn" disabled>Cancel reservation</button>
        </div>

        <p class="res-note" style="margin-top:18px; text-align:left;" id="cancelNote">
          Cancel reservation is disabled 20 hours before the reservation time.
        </p>
      `;
      shell.appendChild(main);

      const total = totalGuests();
      document.getElementById('dShop').textContent = selectedShop ? selectedShop.name : '—';
      document.getElementById('dDate').textContent = formatDate(selectedDate);
      document.getElementById('dTime').textContent = selectedTime || '—';
      document.getElementById('dGuests').textContent = total + ' guest' + (total === 1 ? '' : 's');
      const p = PERIODS.find(x => x.id === selectedPeriodId);
      document.getElementById('dPeriod').textContent = p ? p.name : '—';
      document.getElementById('dEmail').textContent = email || '—';

      const cancelBtn = document.getElementById('cancelBtn');
      const cancelNote = document.getElementById('cancelNote');

      const reserveDate = selectedDate ? new Date(selectedDate + 'T00:00:00') : null;
      const reserveTime = selectedTime ? parseTimeLabel(selectedTime) : null;
      let reservationDateTime = null;
      if(reserveDate && reserveTime){
        reservationDateTime = new Date(reserveDate.getFullYear(), reserveDate.getMonth(), reserveDate.getDate(), reserveTime.hour, reserveTime.minute, 0);
      }

      // disable cancel 20h before reservation
      const cancelDisabled = !reservationDateTime || (Date.now() >= reservationDateTime.getTime() - 20*60*60*1000);
      cancelBtn.disabled = cancelDisabled;
      if(cancelDisabled){
        cancelBtn.style.visibility = 'hidden';
        cancelNote.textContent = reservationDateTime
          ? 'This reservation is within 20 hours, so it can no longer be cancelled from this page.'
          : 'Cancel reservation is disabled because no reservation time was set.';
        cancelNote.style.display = '';
      } else {
        cancelBtn.style.visibility = '';
        cancelNote.style.display = 'none';
      }

      document.getElementById('newBtn').addEventListener('click', () => {
        resetForm();
        goTo(0);
      });
      cancelBtn.addEventListener('click', () => {
        if(cancelBtn.disabled) return;
        if(confirm('Cancel this reservation request for ' + selectedShop.name + '?')){
          submittedReservation = null;
          showToast('Reservation cancelled.');
          resetForm();
          goTo(0);
        }
      });
    }

    // ===== NAVIGATION =====
    function goNext(){
      if(currentPage < PAGES.length - 1){
        currentPage++;
        render();
      }
    }
    function goBack(){
      if(currentPage > 0){
        currentPage--;
        render();
      }
    }
    function goTo(idx){
      if(idx >= 0 && idx < PAGES.length){
        currentPage = idx;
        render();
      }
    }

    function resetForm(){
      selectedShop = SHOPS[0];
      selectedDate = todayISO();
      selectedTime = '';
      guestAdults = 0;
      guestChildren = 0;
      email = '';
      salutation = '';
      firstName = '';
      lastName = '';
      phone = '';
      specialRequests = '';
      acceptedHouseRules = false;
      submittedReservation = null;
      selectedPeriodId = 'all';
    }

    function submitReservation(){
      submittedReservation = {
        shop: selectedShop,
        date: selectedDate,
        time: selectedTime,
        period: PERIODS.find(x => x.id === selectedPeriodId),
        guests: totalGuests(),
        adults: Math.max(0, parseInt(document.getElementById('guestAdults')?.value,10)||0),
        children: Math.max(0, parseInt(document.getElementById('guestChildren')?.value,10)||0),
        contact: { email, salutation, firstName, lastName, phone, specialRequests }
      };
      currentPage = PAGES.length - 1;
      render();
      showToast('Reservation sent to ' + selectedShop.name + '.');
    }

    function showToast(msg){
      toastEl.textContent = msg;
      toastEl.classList.remove('hidden');
      toastEl.setAttribute('aria-live','polite');
      clearTimeout(showToast._t);
      showToast._t = setTimeout(() => toastEl.classList.add('hidden'), 3200);
    }

    // ===== INIT =====
    render();
  </script>
</body>
</html>
