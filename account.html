<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Your Lang Nuong Vietnam account.">
  <title>My Account | Lang Nuong Vietnam</title>
  <link rel="stylesheet" href="style.css?v=20260915-26">
</head>
<body>
  <header class="site-header">
    <div class="nav-inner">
      <a href="index.html" class="nav-logo" aria-label="Làng Nướng Vietnam home">
        <img src="https://langnuonggroup.com/wp-content/uploads/2024/07/LNGROUP.png" alt="Làng Nướng Vietnam">
      </a>
      <nav class="nav-menu">
        <a href="index.html">Home</a>
        <a href="shop.html">Shop Now</a>
      </nav>
    </div>
  </header>

  <main class="section-full section-light">
    <div class="section account-page">
      <span class="hero-eyebrow">Lang Nuong Vietnam</span>
      <h1 class="section-title">My Account</h1>
      <div class="section-divider"></div>
      <p class="account-greeting">Hello! Thank you for using Lang Nuong.</p>
      <p id="accountPageStatus" class="account-status">Loading your account…</p>
      <section class="account-auth-card" id="accountAuth" hidden>
        <h2 id="authModeTitle">Sign in</h2>
        <button type="button" class="google-sign-in" id="googleSignIn">
          <span aria-hidden="true">G</span>
          <span>Continue with Google</span>
        </button>
        <div class="account-divider"><span>or</span></div>
        <form class="account-form" id="accountAuthForm">
          <label for="authEmail">Email address</label>
          <input id="authEmail" type="email" autocomplete="email" required>
          <label for="authPassword">Password</label>
          <input id="authPassword" type="password" minlength="6" autocomplete="current-password" required>
          <button type="submit" class="btn btn-primary" id="authSubmit">Sign In</button>
        </form>
        <button type="button" class="account-mode-link" id="toggleAuthMode">Create an account</button>
      </section>
      <section class="account-profile-card" id="accountProfile" hidden>
        <img id="accountAvatar" class="account-avatar" src="" alt="">
        <div>
          <h2 id="accountName"></h2>
          <p id="accountEmail"></p>
          <p class="account-page-note">Your account is securely managed with Google and Supabase.</p>
        </div>
      </section>
      <div class="account-page-actions">
        <button type="button" class="btn btn-primary" id="accountPageSignOut" hidden>Sign Out</button>
        <button type="button" class="btn btn-danger" id="accountDelete" hidden>Delete Account</button>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="footer-bottom">© Lang Nuong Vietnam | All Rights Reserved · <a href="privacy.html">Privacy Policy</a> · <a href="terms.html">Terms and Conditions</a></div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1"></script>
  <script>
    const supabaseClient = window.supabase.createClient(
      'https://egggnxmzxbqdsqqlnvig.supabase.co',
      'sb_publishable_jostM0x7NIGiLikFjVHLwA_I_x0IpS8'
    );
    const status = document.getElementById('accountPageStatus');
    const profile = document.getElementById('accountProfile');
    const signOut = document.getElementById('accountPageSignOut');
    const deleteAccount = document.getElementById('accountDelete');

    const saveProfile = async user => {
      const { error } = await supabaseClient.from('profiles').upsert({
        id: user.id,
        email: user.email,
        full_name: user.user_metadata.full_name || user.user_metadata.name || null,
        avatar_url: user.user_metadata.avatar_url || user.user_metadata.picture || null,
        updated_at: new Date().toISOString()
      });
      if (error) throw error;
    };

    const displayAccount = user => {
      if (!user) {
        status.textContent = 'Choose a sign-in option below.';
        auth.hidden = false;
        signOut.hidden = true;
        deleteAccount.hidden = true;
        return;
      }
      const name = user.user_metadata.full_name || user.user_metadata.name || user.email;
      const avatar = user.user_metadata.avatar_url || user.user_metadata.picture;
      document.getElementById('accountName').textContent = name;
      document.getElementById('accountEmail').textContent = user.email;
      if (avatar) {
        document.getElementById('accountAvatar').src = avatar;
        document.getElementById('accountAvatar').alt = `${name} profile photo`;
      } else {
        document.getElementById('accountAvatar').hidden = true;
      }
      status.hidden = true;
      auth.hidden = true;
      profile.hidden = false;
      signOut.hidden = false;
      deleteAccount.hidden = false;
    };

    const loadAndSaveSession = async session => {
      const user = session?.user || null;
      displayAccount(user);
      if (!user) return;
      try {
        await saveProfile(user);
      } catch (profileError) {
        status.hidden = false;
        status.textContent = `Signed in, but profile saving failed: ${profileError.message}`;
      }
    };

    supabaseClient.auth.getSession().then(async ({ data, error }) => {
      if (error) {
        status.textContent = `Unable to load your account: ${error.message}`;
        return;
      }
      await loadAndSaveSession(data.session);
    });

    signOut.addEventListener('click', async () => {
      signOut.disabled = true;
      const { error } = await supabaseClient.auth.signOut({ scope: 'local' });
      if (error) {
        signOut.disabled = false;
        status.hidden = false;
        status.textContent = `Sign out failed: ${error.message}`;
        return;
      }
      window.location.replace('account.html');
    });

    deleteAccount.addEventListener('click', async () => {
      const confirmed = window.confirm('Delete your Lang Nuong account permanently? This cannot be undone.');
      if (!confirmed) return;
      deleteAccount.disabled = true;
      status.hidden = false;
      status.textContent = 'Deleting your account…';
      const { error } = await supabaseClient.rpc('delete_own_account');
      if (error) {
        deleteAccount.disabled = false;
        status.textContent = `Account deletion failed: ${error.message}`;
        return;
      }
      await supabaseClient.auth.signOut();
      status.textContent = 'Your account has been deleted.';
      profile.hidden = true;
      signOut.hidden = true;
      deleteAccount.hidden = true;
    });

    const auth = document.getElementById('accountAuth');
    const authForm = document.getElementById('accountAuthForm');
    const authSubmit = document.getElementById('authSubmit');
    const authModeTitle = document.getElementById('authModeTitle');
    const toggleAuthMode = document.getElementById('toggleAuthMode');
    const googleSignIn = document.getElementById('googleSignIn');
    let signUpMode = false;

    const showAuth = () => {
      auth.hidden = false;
      profile.hidden = true;
      signOut.hidden = true;
      deleteAccount.hidden = true;
      status.hidden = false;
      status.textContent = '';
    };

    const updateAuthMode = () => {
      signUpMode = !signUpMode;
      authModeTitle.textContent = signUpMode ? 'Create an account' : 'Sign in';
      authSubmit.textContent = signUpMode ? 'Sign Up' : 'Sign In';
      toggleAuthMode.textContent = signUpMode ? 'Already have an account? Sign in' : 'Create an account';
    };

    googleSignIn.addEventListener('click', async () => {
      status.textContent = 'Opening Google sign-in…';
      const { error } = await supabaseClient.auth.signInWithOAuth({
        provider: 'google',
        options: { redirectTo: `${window.location.origin}${window.location.pathname}` }
      });
      if (error) status.textContent = `Google sign-in failed: ${error.message}`;
    });

    authForm.addEventListener('submit', async event => {
      event.preventDefault();
      authSubmit.disabled = true;
      const email = document.getElementById('authEmail').value.trim();
      const password = document.getElementById('authPassword').value;
      const result = signUpMode
        ? await supabaseClient.auth.signUp({ email, password, options: { emailRedirectTo: `${window.location.origin}${window.location.pathname}` } })
        : await supabaseClient.auth.signInWithPassword({ email, password });
      authSubmit.disabled = false;
      if (result.error) {
        status.textContent = result.error.message;
        return;
      }
      if (signUpMode && !result.data.session) {
        status.textContent = 'Account created. Check your email to confirm your address.';
      }
    });

    toggleAuthMode.addEventListener('click', updateAuthMode);
    supabaseClient.auth.onAuthStateChange((_event, session) => {
      window.setTimeout(() => loadAndSaveSession(session), 0);
    });
  </script>
</body>
</html>
